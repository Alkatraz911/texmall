version: "3.9"  # optional since v1.27.0
services:
  app:
    build: .
    container_name: app
    depends_on:
      - postgres
    networks:
      - myNet
    ports:
      - ${PORT}:${PORT}
    logging:
      driver: json-file
    volumes:
      - logs:/user/app/src/logs
      - ./src:/user/app/src
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: always 
  postgres:
    build: ./src/database
    container_name: database
    networks:
      - myNet
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data/pgdata    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: always  
networks:
  myNet:
volumes:
  logs:
  pg_data: